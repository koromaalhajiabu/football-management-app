<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --green:#0b6e3a; --dark:#0f1f17; --light:#f4f7f5; --line:#dfe6e1; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--light); color:var(--dark); }
  header { background:var(--green); color:#fff; padding:14px 18px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; }
  header a { color:#fff; text-decoration:none; margin-left:14px; }
  header .brand { font-weight:700; font-size:1.1rem; margin-left:0; }
  main { max-width:1000px; margin:0 auto; padding:18px; }
  h1 { font-size:1.5rem; margin:4px 0 14px; }
  h2 { font-size:1.2rem; margin:0 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:left; }
  th { background:#eef4f0; }
  td.num, th.num { text-align:center; }
  input, select, button { font:inherit; padding:8px; border:1px solid #bfcbc4; border-radius:6px; margin:4px 4px 4px 0; max-width:100%; }
  button { background:var(--green); color:#fff; border:0; cursor:pointer; }
  button.danger { background:#b3261e; }
  a.link { color:var(--green); }
  .flash { background:#fff4cc; border:1px solid #e6c200; padding:10px; border-radius:8px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .muted { color:#5b6b63; font-size:.9rem; }
  form.inline { display:inline; }
  footer { text-align:center; color:#5b6b63; font-size:.85rem; padding:20px; }
  @media (max-width:600px) { th, td { padding:6px; font-size:.85rem; } }
  @media print {
    header, footer, .no-print, .flash, nav { display:none !important; }
    body { background:#fff; }
    main { padding:0; max-width:none; }
    .card { box-shadow:none; border:0; padding:0; margin-bottom:10px; }
    .sheet-sign { display:flex; justify-content:space-between; margin-top:36px; }
    .sheet-sign div { border-top:1px solid #000; width:40%; padding-top:4px; font-size:10pt; }
  }
  .sheet-sign { display:flex; justify-content:space-between; gap:24px; margin-top:36px; }
  .sheet-sign div { border-top:1px solid #64748b; width:40%; padding-top:6px; font-size:.9rem; color:#334155; }
  .sheet-head { text-align:center; border-bottom:2px solid #0a2540; padding-bottom:10px; margin-bottom:14px; }
  .sheet-head h1 { font-size:1.4rem; margin:0; }
  .sheet-score { font-size:2rem; font-weight:700; text-align:center; margin:8px 0; font-variant-numeric:tabular-nums; }

  /* ---------- Premium theme ---------- */
  :root {
    --green:#0072c6; --green-2:#1eb53a; --gold:#f5b700; --gold-soft:#fff1b8;
    --navy:#0a1e3c; --navy-2:#0b3a6e; --dark:#0f1b2d; --light:#f4f7fb; --line:#e2e9f2;
    --ink-muted:#5b6b7f; --radius:16px;
    --shadow:0 1px 2px rgba(10,30,60,.06), 0 8px 24px rgba(10,30,60,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --light:#0a1322; --dark:#e8eef7; --line:#1d2c42; --ink-muted:#93a4ba; }
  }
  body {
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 90% -10%, rgba(245,183,0,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(30,181,58,.10), transparent 60%),
      var(--light);
    color:var(--dark); -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; flex-direction:column;
  }
  header {
    background:linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 55%, #0a5aa0 100%);
    color:#fff; padding:16px 22px; position:sticky; top:0; z-index:10;
    border-bottom:1px solid rgba(245,183,0,.35);
    box-shadow:0 6px 24px rgba(0,0,0,.18);
  }
  header .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px; font-size:1.15rem; }
  header .brand .mark {
    width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--gold),#fff1c2); color:var(--navy); font-size:1rem; box-shadow:0 2px 10px rgba(245,183,0,.35);
  }
  header nav a {
    color:rgba(255,255,255,.85); margin-left:6px; padding:7px 12px; border-radius:999px; font-size:.92rem; font-weight:500;
    transition:background .2s, color .2s;
  }
  header nav a:hover { background:rgba(255,255,255,.10); color:#fff; }
  main { max-width:1080px; padding:26px 20px 40px; width:100%; margin:0 auto; flex:1; animation:rise .45s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  h1 { font-size:1.9rem; font-weight:800; letter-spacing:-.02em; margin:6px 0 18px; }
  h2 { font-size:1.15rem; font-weight:700; letter-spacing:-.01em; margin:0 0 12px; }
  .card {
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:18px; box-shadow:var(--shadow); overflow-x:auto;
    transition:transform .2s, box-shadow .2s;
  }
  .grid .card:hover { transform:translateY(-2px); box-shadow:0 14px 34px rgba(10,30,60,.12); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card { background:#122039; }
  }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:.94rem; }
  th, td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; }
  th { background:transparent; color:var(--ink-muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover td, table tr:hover td { background:rgba(30,181,58,.05); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  input, select {
    font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin:4px 6px 4px 0;
    background:#fff; color:var(--dark); max-width:100%; transition:border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus { outline:none; border-color:var(--green-2); box-shadow:0 0 0 4px rgba(30,181,58,.15); }
  button {
    font:inherit; font-weight:600; padding:10px 16px; border:0; border-radius:10px; margin:4px 4px 4px 0; cursor:pointer;
    background:linear-gradient(135deg,var(--green),var(--green-2)); color:#fff;
    box-shadow:0 2px 8px rgba(0,114,198,.25); transition:transform .15s, box-shadow .2s, filter .2s;
  }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,114,198,.3); }
  button:active { transform:translateY(0); }
  button.danger { background:linear-gradient(135deg,#b3261e,#e5484d); box-shadow:0 2px 8px rgba(179,38,30,.25); }
  a.link { color:var(--green); font-weight:600; text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  .flash {
    background:linear-gradient(90deg,var(--gold-soft),#f5faff); border:1px solid #f1d25a; color:#4a3700;
    padding:12px 16px; border-radius:12px; margin-bottom:16px; font-weight:500; box-shadow:var(--shadow);
  }
  .grid { gap:18px; }
  .muted { color:var(--ink-muted); font-size:.9rem; }
  details.edit-admin { display:inline-block; margin-right:6px; vertical-align:top; }
  details.edit-admin summary { list-style:none; cursor:pointer; display:inline-block; padding:10px 16px; border-radius:10px; font-weight:600; background:var(--gold-soft); color:#4a3a05; margin:4px 4px 4px 0; }
  details.edit-admin summary::-webkit-details-marker { display:none; }
  details.edit-admin form { margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#fbfcfb; min-width:260px; }
  footer {
    margin-top:auto; text-align:center; padding:22px 20px; color:var(--ink-muted); font-size:.88rem;
    border-top:1px solid var(--line); background:rgba(255,255,255,.5); backdrop-filter:blur(6px);
  }
  footer .credit { font-weight:700; background:linear-gradient(90deg,#b8860b,var(--gold),#b8860b); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .page-head h1 { margin-bottom:4px; }
  .hero {
    background:linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 60%, #0a5aa0 100%);
    color:#fff; border-radius:20px; padding:30px 28px; margin-bottom:24px; position:relative; overflow:hidden;
    box-shadow:0 18px 40px rgba(10,30,60,.28); border:1px solid rgba(245,183,0,.35);
  }
  .hero::after {
    content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(245,183,0,.35), transparent 70%);
  }
  .hero h1 { color:#fff; font-size:2.1rem; margin:4px 0 8px; }
  .hero .muted { color:rgba(255,255,255,.78); margin:0; max-width:560px; }
  .eyebrow { text-transform:uppercase; letter-spacing:.18em; font-size:.74rem; font-weight:700; color:var(--gold); margin:0; }
  .grid .card { border-top:3px solid var(--gold); }
  .grid .card h2 { font-size:1.3rem; }
  .panel-bar { display:flex; align-items:center; flex-wrap:wrap; gap:10px; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:10px 14px; margin-bottom:18px; box-shadow:var(--shadow); }
  .panel-bar .spacer { flex:1; }
  .panel-bar a { color:var(--dark); text-decoration:none; font-weight:600; font-size:.92rem; padding:6px 10px; border-radius:8px; }
  .panel-bar a:hover { background:var(--line); }
  .panel-bar a.on { background:var(--navy-2); color:#fff; }
  .panel-bar .logout-btn { margin:0; padding:7px 14px; }
  .panel-who { font-size:.85rem; }
  .panel-tag { font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; padding:6px 10px; border-radius:999px; color:#fff; }
  .panel-tag.viewer { background:#64748b; }
  .panel-tag.admin { background:var(--green); }
  .panel-tag.developer { background:linear-gradient(90deg,#b8860b,var(--gold)); color:#1b1400; }
  .frozen { text-align:center; padding:70px 20px; }
  .frozen-icon { font-size:3rem; margin-bottom:8px; }
  @media (max-width:600px) {
    main { padding:18px 14px 30px; }
    h1 { font-size:1.5rem; }
    th, td { padding:8px 6px; font-size:.84rem; }
    header { padding:14px 16px; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><span class="mark">⚽</span>Football Management</a>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="card">Loading…</div></main>
<footer>Sierra Leone Football Management System<br><span class="credit">Designed by Alhaji Abu Koroma</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   CONFIGURATION (the publishable key is safe to place here)
   ========================================================== */
const SUPABASE_URL = "https://ticcaervmjdzbprdpxxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_WSlNd0DeyV4Z0vM3fM28iA_c5BIYRiL";
// Some in-app previews cannot copy Headers objects, so send headers as a plain object.
const plainFetch = (url, opts = {}) => {
  const o = { ...opts };
  if (o.headers && typeof o.headers.forEach === "function" && !Array.isArray(o.headers)) {
    const h = {};
    o.headers.forEach((v, k) => { h[k] = v; });
    o.headers = h;
  }
  return fetch(url, o);
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: plainFetch } });

const A = {};       // action handlers used by forms and buttons
let db = { leagues: [], admins: [], system: { frozen: false, message: "", frozen_at: null } };
let me = null;      // logged-in admin { user_id, username, role } or null

/* ---------- load data from Supabase ---------- */
async function loadData() {
  const [L, T, P, F, E] = await Promise.all([
    sb.from("fm_leagues").select("*").order("id"),
    sb.from("fm_teams").select("*").order("id"),
    sb.from("fm_players").select("*").order("id"),
    sb.from("fm_fixtures").select("*").order("id"),
    sb.from("fm_events").select("*").order("id"),
  ]);
  const failed = [L, T, P, F, E].find(r => r.error);
  if (failed) throw failed.error;
  const S = await sb.from("fm_system").select("*").eq("id", 1).maybeSingle();
  db.system = S.error || !S.data
    ? { frozen: false, message: "", frozen_at: null }
    : { frozen: !!S.data.frozen, message: S.data.message || "", frozen_at: S.data.frozen_at || null };
  db.leagues = L.data.map(l => ({
    id: l.id, name: l.name, season: l.season, owner_id: l.owner_id,
    teams: T.data.filter(t => t.league_id === l.id).map(t => ({
      id: t.id, name: t.name, ground: t.ground || "", colours: t.colours || "",
      players: P.data.filter(p => p.team_id === t.id).map(p => ({
        id: p.id, name: p.name, position: p.position || "", shirt: p.shirt_number, dob: p.date_of_birth || ""
      }))
    })),
    fixtures: F.data.filter(f => f.league_id === l.id).map(f => ({
      id: f.id, homeId: f.home_team_id, awayId: f.away_team_id, date: f.match_date,
      venue: f.venue || "", hs: f.home_score, as: f.away_score, status: f.status,
      referee: f.referee || "", assistant1: f.assistant_1 || "", assistant2: f.assistant_2 || "", motmId: f.motm_player_id,
      events: E.data.filter(e => e.fixture_id === f.id).map(e => ({
        id: e.id, playerId: e.player_id, type: e.event_type
      }))
    }))
  }));
}

async function refreshAdmins() {
  db.admins = [];
  if (me && me.role === "master") {
    const { data } = await sb.from("fm_admins").select("user_id, username, role").order("username");
    db.admins = data || [];
  }
}

async function refreshMe() {
  me = null;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data } = await sb.from("fm_admins").select("user_id, username, role")
    .eq("user_id", session.user.id).maybeSingle();
  if (!data) { await sb.auth.signOut(); return; }
  me = data;
  await refreshAdmins();
}

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function flash(msg) { sessionStorage.setItem("fm_flash", msg); }
function takeFlash() {
  const m = sessionStorage.getItem("fm_flash");
  sessionStorage.removeItem("fm_flash");
  return m ? `<div class="flash">${esc(m)}</div>` : "";
}
function card(inner, extra = "") { return `<div class="card" ${extra}>${inner}</div>`; }
function findLeague(id) { return db.leagues.find(l => l.id === id); }
// Admins manage only the leagues they created; the master manages all.
function canManage(league) {
  return !!me && (me.role === "master" || league.owner_id === me.user_id);
}
function findTeam(id) {
  for (const l of db.leagues) {
    const t = l.teams.find(t => t.id === id);
    if (t) return { league: l, team: t };
  }
  return null;
}
function findFixture(id) {
  for (const l of db.leagues) {
    const f = l.fixtures.find(f => f.id === id);
    if (f) return { league: l, fixture: f };
  }
  return null;
}
function findPlayer(id) {
  for (const l of db.leagues) for (const t of l.teams) {
    const p = t.players.find(p => p.id === id);
    if (p) return { team: t, player: p };
  }
  return null;
}
function teamName(id) { const r = findTeam(id); return r ? r.team.name : "?"; }
function matchInfoLines(f) {
  const lines = [];
  if (f.referee) lines.push(`Referee: ${esc(f.referee)}`);
  if (f.motmId) {
    const pr = findPlayer(f.motmId);
    if (pr) lines.push(`Man of the Match: ${esc(pr.player.name)}${pr.player.shirt != null ? ` (#${pr.player.shirt})` : ""}, ${esc(pr.team.name)}`);
  }
  return lines.map(l => `<div class="muted">${l}</div>`).join("");
}

/* ---------- league calculations ---------- */
function standings(l) {
  const t = {};
  l.teams.forEach(x => t[x.id] = { name: x.name, P:0, W:0, D:0, L:0, GF:0, GA:0, Pts:0 });
  l.fixtures.filter(f => f.status === "finished").forEach(f => {
    [[f.homeId, f.hs, f.as], [f.awayId, f.as, f.hs]].forEach(([id, gf, ga]) => {
      const r = t[id];
      if (!r) return;
      r.P++; r.GF += gf; r.GA += ga;
      if (gf > ga) { r.W++; r.Pts += 3; }
      else if (gf === ga) { r.D++; r.Pts += 1; }
      else r.L++;
    });
  });
  return Object.values(t)
    .map(r => ({ ...r, GD: r.GF - r.GA }))
    .sort((a, b) => b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF || a.name.localeCompare(b.name));
}
function scorers(l) {
  const count = {};
  l.fixtures.forEach(f => f.events.forEach(e => {
    if (e.type === "goal") count[e.playerId] = (count[e.playerId] || 0) + 1;
  }));
  return Object.entries(count).map(([pid, goals]) => {
    const r = findPlayer(Number(pid));
    return { player: r ? r.player.name : "?", team: r ? r.team.name : "?", goals };
  }).sort((a, b) => b.goals - a.goals || a.player.localeCompare(b.player)).slice(0, 10);
}
function fixtureSort(a, b) { return a.date.localeCompare(b.date) || a.id - b.id; }

/* ---------- panel bar: shows which panel you are in, with links and log out ---------- */
function panelBar(a) {
  if (!me) {
    return `<div class="panel-bar"><span class="panel-tag viewer">Public viewers panel</span>
      <span class="spacer"></span><a href="#/login">Admin login</a></div>`;
  }
  const isMaster = me.role === "master";
  const tag = isMaster ? `<span class="panel-tag developer">Developer panel</span>` : `<span class="panel-tag admin">Admin panel</span>`;
  const link = (page, label, href) => `<a href="${href}" class="${a === page ? "on" : ""}">${label}</a>`;
  return `<div class="panel-bar">${tag}<span class="muted panel-who">Signed in as ${esc(me.username)}</span>
    <span class="spacer"></span>
    ${link("admin", "Leagues", "#/admin")}
    ${isMaster ? link("master", "Admin accounts", "#/master") + link("activity", "Activity", "#/activity") : ""}
    ${link("", "Public site", "#/")}
    <button class="danger logout-btn" onclick="A.logout()">Log out</button></div>`;
}

/* ---------- navigation ---------- */
function renderNav() {
  document.getElementById("nav").innerHTML =
    `<a href="#/">Leagues</a>` +
    (me
      ? `<a href="#/admin">Admin</a>` +
        (me.role === "master" ? `<a href="#/master">Master</a><a href="#/activity">Activity</a>` : "") +
        `<a href="#/logout">Log out (${esc(me.username)})</a>`
      : `<a href="#/login">Admin login</a>`);
}

async function route() {
  renderNav();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const [a, b] = parts;
  const id = Number(parts[2]);
  let html;

  if (isFrozenForMe() && a !== "login" && a !== "logout") html = viewFrozen();
  else if (!a) html = viewIndex();
  else if (a === "league") html = viewLeague(Number(b));
  else if (a === "login") html = viewLogin();
  else if (a === "logout") {
    A.logout();
    return;
  }
  else if (a === "admin") {
    if (!me) { location.hash = "#/login"; return; }
    const owner = b === "league" ? findLeague(id)
      : b === "team" ? (findTeam(id) || {}).league
      : b === "fixture" ? (findFixture(id) || {}).league
      : null;
    if (owner && !canManage(owner)) html = card("This league belongs to another admin, so you cannot open it.");
    else if (!b) html = viewAdmin();
    else if (b === "league") html = viewAdminLeague(id);
    else if (b === "team") html = viewAdminTeam(id);
    else if (b === "fixture" && parts[3] === "sheet") html = viewMatchSheet(id);
    else if (b === "fixture") html = viewAdminFixture(id);
  }
  else if (a === "activity") {
    if (!me) { location.hash = "#/login"; return; }
    if (me.role !== "master") { flash("Only the master developer can open this page."); location.hash = "#/admin"; return; }
    html = await viewActivity();
  }
  else if (a === "master") {
    if (!me) { location.hash = "#/login"; return; }
    if (me.role !== "master") {
      flash("Only the master developer can open this page.");
      location.hash = "#/admin";
      return;
    }
    html = viewMaster();
  }
  document.getElementById("app").innerHTML = takeFlash() + (a === "login" ? "" : panelBar(a)) + (html || card("Page not found."));
}

/* ---------- SYSTEM FREEZE ---------- */
function isFrozenForMe() {
  return !!db.system.frozen && !(me && me.role === "master");
}
function viewFrozen() {
  return `<div class="frozen"><div class="frozen-icon">❄</div><h1>System paused</h1>
    <p class="muted">${esc(db.system.message || "This football management system is temporarily paused. Please check back later.")}</p>
    <p><a class="link" href="#/login">Developer sign-in</a></p></div>`;
}
function viewFreezePanel() {
  const s = db.system;
  return card(s.frozen
    ? `<h2>System is frozen</h2>

    ? { frozen: true, frozen_at: new Date().toISOString(), frozen_by: me.username, message: message.trim() || null }

// Must match the server: simple names keep the familiar email, anything else is encoded.
function emailFor(username) {
  if (/^[a-z0-9._-]+$/.test(username)) return `${username}@football.local`;
  const hex = Array.from(new TextEncoder().encode(username)).map(b => b.toString(16).padStart(2, "0")).join("");
  return `u${hex}@football.local`;
}
A.login = async f => {
  const d = Object.fromEntries(new FormData(f));
  const { error } = await sb.auth.signInWithPassword({
    email: (() => { const v = d.username.trim().toLowerCase(); return v.includes("@") ? v : emailFor(v); })(),
    password: d.password,
  });
  if (error) { flash("Wrong username or password."); return route(); }
  await refreshMe();
  if (me && db.system.frozen && me.role !== "master") {
    await sb.auth.signOut(); me = null;
    flash("The system is frozen. Only the developer can sign in.");
    return route();
  }
  if (!me) { flash("This account is not an admin account."); return route(); }
  logActivity("Logged in");
  flash(`Welcome, ${me.username}.`);
  location.hash = "#/admin";
  route();
};

A.logout = async () => {

function logActivity(action) {
  if (!me) return;
  sb.from("fm_activity").insert({ actor_user_id: me.user_id, actor_name: me.username, action })
    .then(({ error }) => { if (error) console.warn("Activity not saved:", error.message); });

/* ---------- write helper: run a change, reload data, re-render ---------- */
async function run(request, msg) {
  const { error } = await request;
  if (error) { alert(error.message); return false; }
  if (msg) logActivity(msg);
  await loadData();
  if (msg) flash(msg);
  route();
  return true;
}

A.exportTable = id => {
  const l = findLeague(id);
  if (!l) return;
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const header = ["Pos", "Team", "P", "W", "D", "L", "GF", "GA", "GD", "Pts"];
  const lines = [header.join(",")];
  standings(l).forEach((r, i) => {
    lines.push([i + 1, q(r.name), r.P, r.W, r.D, r.L, r.GF, r.GA, r.GD, r.Pts].join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${l.name}-${l.season}-table`.replace(/[^a-z0-9-]+/gi, "_") + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

  const motm = f.motmId ? findPlayer(f.motmId) : null;
  const finished = f.status === "finished";
  return `<p class="no-print"><a class="link" href="#/admin/fixture/${f.id}">← Back to match</a> &nbsp;
      <button onclick="window.print()">Print match sheet</button></p>
    <div class="card">
      <div class="sheet-head">
        <div class="muted">${esc(l.name)} · ${esc(l.season)}</div>
        <h1>${esc(teamName(f.homeId))} vs ${esc(teamName(f.awayId))}</h1>
        <div class="muted">${esc(f.date)}${f.venue ? " · " + esc(f.venue) : ""}</div>
      </div>
      <div class="sheet-score">${finished ? `${f.hs} - ${f.as}` : "_ - _"}</div>
      <table style="margin-bottom:14px">
        <tr><th>Referee</th><td>${esc(f.referee || "")}</td></tr>
        <tr><th>Assistant 1</th><td>${esc(f.assistant1 || "")}</td></tr>
        <tr><th>Assistant 2</th><td>${esc(f.assistant2 || "")}</td></tr>
        <tr><th>Man of the Match</th><td>${motm ? `${esc(motm.player.name)} (${esc(motm.team.name)}${motm.player.shirt != null ? ", #" + motm.player.shirt : ""})` : ""}</td></tr>
      </table>
    </div>
    <div class="grid">
      <div class="card"><h2>${esc(teamName(f.homeId))} — lineup</h2>
        <table><tr><th class="num">No.</th><th>Name</th><th>Position</th></tr>
        ${lineup(home).map(playerRow).join("") || `<tr><td colspan="3" class="muted">No players listed.</td></tr>`}</table></div>
      <div class="card"><h2>${esc(teamName(f.awayId))} — lineup</h2>
        <table><tr><th class="num">No.</th><th>Name</th><th>Position</th></tr>
        ${lineup(away).map(playerRow).join("") || `<tr><td colspan="3" class="muted">No players listed.</td></tr>`}</table></div>
    </div>
    <div class="card"><h2>Goals and cards</h2>
      <table><tr><th>Event</th><th>Player</th><th>Team</th></tr>
      ${eventRows || `<tr><td colspan="3" class="muted">None recorded.</td></tr>`}</table></div>
    <div class="sheet-sign">
      <div>Referee signature</div>
      <div>Captain signature</div>
    </div>`;
}

/* ---------- MASTER DEVELOPER ---------- */
function viewMaster() {
  return `<h1>Admin accounts</h1>
  ${viewFreezePanel()}
  ${card(`<h2>Create an admin account</h2>
    <form onsubmit="A.createAdmin(this); return false">
      <input name="username" placeholder="Username (any letters, numbers or symbols)" required>
      <input name="password" type="password" minlength="8" placeholder="Password (min 8 characters)" required>
      <button type="submit">Create admin</button>
    </form>`)}
  ${card(`<table><tr><th>Username</th><th>Role</th><th></th></tr>
    ${db.admins.map(u => `<tr><td>${esc(u.username)}</td>
      <td>${u.role === "master" ? "Master developer" : "Admin"}</td>
      <td>${(u.role === "admin" || u.user_id === me.user_id) ? `<details class="edit-admin"><summary>Edit</summary>
        <form onsubmit="A.updateAdmin('${u.user_id}', this); return false">
          <input name="username" value="${esc(u.username)}" placeholder="New username" required>
          <input name="password" type="password" minlength="8" placeholder="New password (leave blank to keep)">
          <button type="submit">Save changes</button>
        </form></details>` : ""}${u.role === "admin" ? `<button class="danger" onclick="A.deleteAdmin('${u.user_id}')">Remove</button>` : ""}</td></tr>`).join("")}
    </table>`)}`;
}

async function callManageAdmins(body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/fm-manage-admins`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token, "apikey": SUPABASE_KEY },
    body: JSON.stringify(body),
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) { alert(out.error || "Something went wrong."); return false; }
  return true;
}
A.createAdmin = async f => {
  const d = Object.fromEntries(new FormData(f));
  if (await callManageAdmins({ action: "create", username: d.username, password: d.password })) {
    await refreshAdmins();
    logActivity(`Created admin account '${d.username.trim().toLowerCase()}'`);
    flash(`Admin account '${d.username.trim().toLowerCase()}' created.`);
    route();
  }
};
A.updateAdmin = async (userId, f) => {
  const d = Object.fromEntries(new FormData(f));
  const body = { action: "update", user_id: userId, username: d.username };
  if (d.password) body.password = d.password;
  const u = db.admins.find(x => x.user_id === userId);
  if (u && body.username.trim().toLowerCase() === u.username && !d.password) { flash("Nothing to change."); return route(); }
  if (await callManageAdmins(body)) {
    await refreshAdmins();
    logActivity(`Edited admin account '${u ? u.username : userId}'` + (d.password ? " (password changed)" : ""));
    flash("Admin account updated.");
    route();
  }
};
A.deleteAdmin = async userId => {
  if (!confirm("Remove this admin account?")) return;
  if (await callManageAdmins({ action: "delete", user_id: userId })) {
    await refreshAdmins();
    logActivity("Removed an admin account");
    flash("Admin account removed.");
    route();
  }
};

/* ---------- start ---------- */
(async function init() {
  try {
    await loadData();
    await refreshMe();
    if (me && db.system.frozen && me.role !== "master") { await sb.auth.signOut(); me = null; }
  } catch (e) {
    document.getElementById("app").innerHTML = card(`Could not connect to the database: ${esc(e.message)}`);
    return;
  }
  window.addEventListener("hashchange", route);
  if (!location.hash) location.hash = "#/";
  route();
})();
</script>
